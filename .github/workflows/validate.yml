name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: brew install xcodegen
      - run: make engine
      - run: python3 scripts/verify_engine.py
      - run: python3 -m unittest discover -s tests -v
      - run: make gen
      - name: Build and test
        run: >-
          xcodebuild -project FRTMProxy.xcodeproj -scheme FRTMProxy
          -destination 'platform=macOS' -derivedDataPath .build
          -resultBundlePath artifacts/Tests.xcresult
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' test
      - name: Test embedded proxy against local clients
        run: python3 tests/integration_proxy.py --worker .build/Build/Products/Debug/FRTMProxy.app/Contents/MacOS/FRTMProxy
      - name: Stress embedded proxy with small and large bodies
        run: python3 tests/stress_proxy.py --worker .build/Build/Products/Debug/FRTMProxy.app/Contents/MacOS/FRTMProxy --requests 1000 --report artifacts/proxy-stress.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics
          path: artifacts/
          retention-days: 7
